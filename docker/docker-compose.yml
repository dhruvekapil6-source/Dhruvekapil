version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fleet_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - fleet_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fleet_network

  # Django Backend
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DEBUG: "True"
      SECRET_KEY: django-insecure-dev-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fleet_management
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ../backend:/app
    networks:
      - fleet_network
    command: python manage.py runserver 0.0.0.0:8000

  # Frontend (optional - serve with nginx)
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - fleet_network

volumes:
  postgres_data:
  redis_data:

networks:
  fleet_network:
    driver: bridge
