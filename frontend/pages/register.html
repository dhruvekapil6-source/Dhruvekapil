<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Fleet Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Fleet Manager</h1>
                <p>Create your account</p>
            </div>
            <form id="registerForm">
                <div id="registerMessage" class="alert d-none" role="alert"></div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label for="firstName" class="form-label">First name</label><input type="text" class="form-control" id="firstName"></div>
                    <div class="col-md-6 mb-3"><label for="lastName" class="form-label">Last name</label><input type="text" class="form-control" id="lastName"></div>
                </div>
                <div class="mb-3"><label for="username" class="form-label">Username</label><input type="text" class="form-control" id="username" required autocomplete="username"></div>
                <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" required autocomplete="email"></div>
                <div class="mb-3"><label for="phone" class="form-label">Phone</label><input type="tel" class="form-control" id="phone" autocomplete="tel"></div>
                <div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" class="form-control" id="password" minlength="8" required autocomplete="new-password"><small class="text-muted">Use at least 8 characters.</small></div>
                <div class="mb-3"><label for="confirmPassword" class="form-label">Confirm password</label><input type="password" class="form-control" id="confirmPassword" minlength="8" required autocomplete="new-password"></div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Create account</button>
                <p class="text-center mb-0">Already have an account? <a href="login.html">Log in</a></p>
            </form>
        </div>
    </div>
    <script src="../js/register.js"></script>
</body>
</html>
