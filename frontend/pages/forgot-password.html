<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Fleet Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Reset password</h1>
                <p id="resetInstructions">Enter your account email to receive a reset link.</p>
            </div>
            <div id="resetMessage" class="alert d-none" role="alert"></div>
            <form id="requestResetForm">
                <div class="mb-3">
                    <label for="identifier" class="form-label">Username or email</label>
                    <input type="text" class="form-control" id="identifier" required autocomplete="username">
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Send reset link</button>
                <p class="text-center mb-0"><a href="login.html">Back to login</a></p>
            </form>
            <form id="resetPasswordForm" hidden>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">New password</label>
                    <input type="password" class="form-control" id="newPassword" minlength="8" required autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm new password</label>
                    <input type="password" class="form-control" id="confirmPassword" minlength="8" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Reset password</button>
                <p class="text-center mb-0"><a href="login.html">Back to login</a></p>
            </form>
        </div>
    </div>
    <script src="../js/forgot-password.js"></script>
</body>
</html>
