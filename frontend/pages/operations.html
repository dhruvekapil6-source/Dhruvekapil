<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Operations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-module="{{ module }}">
    <div class="wrapper">
        <nav class="sidebar">
            <div class="sidebar-header"><h3><i class="fas fa-truck"></i> Fleet Manager</h3></div>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li><a href="vehicles.html"><i class="fas fa-car"></i> Vehicles</a></li>
                <li><a href="drivers.html"><i class="fas fa-user-tie"></i> Drivers</a></li>
                <li><a href="trips.html"><i class="fas fa-map-location-dot"></i> Trips</a></li>
                <li><a href="routes.html"><i class="fas fa-route"></i> Routes</a></li>
                <li><a href="fuel.html"><i class="fas fa-gas-pump"></i> Fuel</a></li>
                <li><a href="maintenance.html"><i class="fas fa-wrench"></i> Maintenance</a></li>
                <li><a href="reports.html"><i class="fas fa-file-lines"></i> Reports</a></li>
                <li><a href="notifications.html"><i class="fas fa-bell"></i> Notifications</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
                <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </nav>
        <main class="main-content">
            <nav class="top-navbar">
                <div class="navbar-left">
                    <button class="toggle-sidebar" id="toggle-sidebar" type="button" aria-label="Toggle navigation"><i class="fas fa-bars"></i></button>
                    <h2 id="page-title">Fleet operations</h2>
                </div>
                <div class="navbar-right"><span id="user-name">Fleet team</span></div>
            </nav>
            <div class="container-fluid p-4">
                <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
                    <div><p class="eyebrow">Fleet operations</p><h1 id="page-heading">Records</h1><p id="page-description" class="intro-copy"></p></div>
                    <button id="new-record" class="btn btn-primary" type="button"><i class="fas fa-plus" aria-hidden="true"></i> New record</button>
                </div>
                <div id="page-message" class="alert d-none" role="status"></div>
                <section id="record-form-panel" class="card mb-4" hidden>
                    <div class="card-header d-flex justify-content-between align-items-center"><h2 id="form-heading" class="h5 mb-0">New record</h2><button id="close-form" class="btn-close" type="button" aria-label="Close"></button></div>
                    <div class="card-body"><form id="record-form"><div id="record-fields" class="row g-3"></div><div class="d-flex gap-2 mt-3"><button class="btn btn-primary" type="submit">Save record</button><button id="cancel-form" class="btn btn-light" type="button">Cancel</button></div></form></div>
                </section>
                <section class="card">
                    <div class="card-header d-flex justify-content-between align-items-center"><h2 class="h5 mb-0">Records</h2><button id="refresh-records" class="btn btn-light btn-sm" type="button" aria-label="Refresh records" title="Refresh"><i class="fas fa-rotate-right" aria-hidden="true"></i></button></div>
                    <div class="table-responsive"><table class="table table-hover mb-0"><thead id="records-head"></thead><tbody id="records-body"><tr><td>Loading records...</td></tr></tbody></table></div>
                </section>
            </div>
        </main>
    </div>
    <script src="../js/api-client.js"></script>
    <script src="../js/operations.js"></script>
</body>
</html>
